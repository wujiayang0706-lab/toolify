<!DOCTYPE html>
<html lang="en">
<head>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.spinner{width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#06C755;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}

</style>

  <div class="spinner"></div>
  <p id="status">Completing LINE login...</p>
</div>

// Handle LINE Login callback (implicit grant flow)
// The access token is returned in the URL hash fragment
window.handleLINECallback();
</script>
