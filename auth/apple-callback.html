<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Sign in with Apple - Toolify</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.spinner{width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#000;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
p{color:#475569;font-size:16px}
</style>
</head>
<body>
<div style="text-align:center">
  <div class="spinner"></div>
  <p id="status">Completing Apple sign in...</p>
</div>
<script src="/assets/config.js"></script>
<script src="/assets/app.js"></script>
<script>
// Handle Sign in with Apple callback (implicit flow)
// The id_token is returned in the URL hash fragment
window.handleAppleCallback();
</script>
</body>
</html>
